namespace: quiz-namespace

imagePullSecrets: []

backend:
  image: 143353052589.dkr.ecr.us-east-1.amazonaws.com/quiz-app-backend
  tag: "latest"

frontend:
  image: 143353052589.dkr.ecr.us-east-1.amazonaws.com/quiz-app-frontend
  tag: "latest"

service:
  frontendType: LoadBalancer
  port: 80

mongodb:
  persistence:
    enabled: true
    storageClass: "gp2"
    size: 5Gi