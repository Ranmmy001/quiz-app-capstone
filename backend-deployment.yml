apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: 143353052589.dkr.ecr.us-east-1.amazonaws.com/quiz-app-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 2323

          envFrom:
            - secretRef:
                name: backend-secret