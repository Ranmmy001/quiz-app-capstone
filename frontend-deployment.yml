apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: 143353052589.dkr.ecr.us-east-1.amazonaws.com/quiz-app-frontend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80